[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "log-signature-clusterer"
version = "0.1.0"
description = "Cluster raw log lines into their distinct signatures, ranked by frequency"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Arnav Chawla" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Logging",
]

[project.scripts]
logsig = "logsig.cli:main"

[tool.setuptools]
packages = ["logsig"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
